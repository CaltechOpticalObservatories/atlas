[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "A configurable FITS image viewer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Prakriti Gupta", email = "pgupta@astro.caltech.edu" },
]
keywords = ["FITS", "astronomy", "viewer", "imaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "astropy",
    "matplotlib",
    "numpy",
    "PyQt5",
    "pyyaml",
]

[project.optional-dependencies]
# Only needed for the optional `zmq` tool, which is off by default.
zmq = ["pyzmq"]
dev = ["pylint", "pytest"]
# Building the documentation needs no Qt and no display, so these are kept
# separate from `dev` and `tox -e docs` installs them without atlas itself.
docs = [
    "sphinx>=7.2",
    "shibuya>=2024.10.15",
    "myst-parser>=3.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "linkify-it-py>=2.0",
]

[project.urls]
Homepage = "https://github.com/CaltechOpticalObservatories/atlas"
Documentation = "https://github.com/CaltechOpticalObservatories/atlas/tree/main/docs"
Issues = "https://github.com/CaltechOpticalObservatories/atlas/issues"

[project.scripts]
atlas = "atlas.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on an unregistered mark or a typo'd fixture rather than skipping quietly.
addopts = "--strict-markers --strict-config"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The bundled profiles are data, not code, so they must be declared explicitly
# or `--profile` finds nothing in an installed copy.
"atlas.config" = ["profiles/*.yaml"]
