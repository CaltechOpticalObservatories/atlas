[tox]
# Every check has one command that behaves the same locally and in CI.
env_list = tests, lint
# A missing 3.12 must fail rather than skip: a silent skip would report
# "congratulations" without having run a single test. The docs environment sets
# its own basepython, so it builds regardless of which interpreters are around.
skip_missing_interpreters = false

[testenv]
basepython = python3.12

[testenv:tests]
description = Run the test suite
extras =
    dev
    zmq
setenv =
    # The Qt tests need no display; this is what CI uses too.
    QT_QPA_PLATFORM = offscreen
commands = pytest {posargs:-v}

[testenv:lint]
description = Run pylint over every tracked Python file
extras =
    dev
    zmq
commands = pylint --rcfile=.pylintrc {posargs:src tests scripts docs/conf.py}

[testenv:docs]
description = Build the HTML documentation
# atlas itself is deliberately not installed: the docs are hand written, so the
# build needs neither Qt nor a display.
skip_install = true
basepython = python3
deps =
    sphinx>=7.2
    shibuya>=2024.10.15
    myst-parser>=3.0
    sphinx-copybutton>=0.5
    sphinx-design>=0.6
    linkify-it-py>=2.0
# -W turns warnings into errors, so a bad cross reference fails the build
# instead of producing a quietly broken page.
commands =
    sphinx-build -b html -W --keep-going {posargs} docs docs/_build/html
    python -c 'print("\ndocs built: docs/_build/html/index.html")'

[testenv:serve]
description = Build the docs and rebuild on every save
skip_install = true
basepython = python3
deps =
    {[testenv:docs]deps}
    sphinx-autobuild>=2024.2
commands =
    sphinx-autobuild -b html --open-browser --port 8000 {posargs} docs docs/_build/html
