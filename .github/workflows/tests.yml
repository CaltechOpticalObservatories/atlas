name: Tests

on: [push]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,zmq]"
    - name: Run the test suite
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        pytest -v
