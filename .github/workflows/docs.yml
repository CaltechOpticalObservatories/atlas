name: Docs

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        pip install tox
    # tox -e docs sets skip_install, so the documentation builds without atlas,
    # without Qt and without a display. It also passes -W, so a broken cross
    # reference or a page missing from the toctree fails the job.
    - name: Build the documentation
      run: |
        tox -e docs
    - name: Upload the built site
      uses: actions/upload-artifact@v4
      with:
        name: docs-html
        path: docs/_build/html
        retention-days: 14
