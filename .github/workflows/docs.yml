name: Docs

on: [push]

# One deployment at a time, and never cancel one halfway: an interrupted
# deploy would leave the published site in a half-updated state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        pip install tox
    # tox -e docs sets skip_install, so the documentation builds without atlas,
    # without Qt and without a display. It also passes -W, so a broken cross
    # reference or a page missing from the toctree fails the job.
    - name: Build the documentation
      run: |
        tox -e docs
    # A plain artifact, downloadable from any branch's run, for reading a
    # documentation change as rendered HTML before it is merged.
    - name: Upload the built site
      uses: actions/upload-artifact@v4
      with:
        name: docs-html
        path: docs/_build/html
        retention-days: 14
    # The Pages-specific format the deploy job below consumes.
    - name: Upload the Pages artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_build/html

  # Publishes to GitHub Pages
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
