# COO detector work: compare frames side by side and subtract signal/reset taps.
display:
  mode: tile
  tile_columns: 1
  zoom: 1.0
tools:
  header: true
  histogram: true
  tap_subtraction:
    enabled: true
    tap_width: 128
    num_taps: 32
  zmq:
    enabled: true
    address: tcp://localhost:5555
    socket_type: SUB
  # Frame and region statistics: Shift+drag a box to summarise it
  statistics:
    enabled: true
    update_hz: 2.0
  # Disabled until verified against a real segment
  shm:
    enabled: false
    segment_name: hispec_tracking_camera
