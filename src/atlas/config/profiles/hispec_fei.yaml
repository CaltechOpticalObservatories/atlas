# HISPEC FEI
display:
  mode: single
  zoom: 1.0
save:
  directory: /tmp/data    # frames go in <directory>/<UTC date>/
tools:
  header: true
  histogram: true
  # A toolbar button for File → Save Frame, saving under save.directory above,
  # with a Frames box for saving several stream frames as one cube
  save_button: true
  shm:
    enabled: true
    segment_name: hispec_tracking_camera
    # Where the hsfei_atcam daemon writes; the MILK_SHM_DIR, /milk/shm, /tmp
    # fallback would find nothing there, or a stale segment
    shm_dir: /dev/shm
    display_fps_cap: 15.0
    # Share of the memory free at the time that a multi-frame save may fill;
    # the Frames box stops at however many frames that holds
    capture_memory_fraction: 0.5
  # Frame and region statistics: Shift+drag a box to summarise it
  statistics:
    enabled: true
    update_hz: 2.0
